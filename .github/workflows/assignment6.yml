name: Micronaut Build & Test

on:
  pull_request:
    types: [closed]  
  workflow_dispatch:  

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mn_playground
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build & Run Tests
        run: ./gradlew build

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-crud-jar
          path: build/libs/*.jar

      - name: Deploy to AWS S3
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ASIAR5YGFGNNFWJYUQVP
          AWS_SECRET_ACCESS_KEY: qwkeBwwwUPt0144JZ7Sa6wV6H+H7C7WzTfsDSQJE
          AWS_SESSION_TOKEN: 
          AWS_REGION: "us-east-1"
          S3_BUCKET: "assignment6buckets"
        run: aws s3 cp build/libs/ s3://$S3_BUCKET/ --recursive
